# Daily snapshot of issues, comments and discussions from DPI-bypass repos via the official GitHub API.
# dpi-feeds/{ntc,web}*.{jsonl,txt} are pushed by .github/scripts/pi_feeds.sh on Daniel's Raspberry Pi instead:
# ntc.party refuses GitHub's runners, Habr and gfw.report refuse the digest's cloud shell.
# Read by the "B4 DPI bypass digest" scheduled task (git clone of this repo, reads dpi-feeds/).
# The task starts this run itself: it pushes dpi-feeds/refresh first, collects git activity while this runs (~1 min),
# then reads the fresh snapshot.
name: dpi-feeds

on:
  push:
    paths: ["dpi-feeds/refresh"]   # pushed by the digest task at the start of its run
  schedule:
    - cron: "7 4 * * *"   # fallback only: GitHub starts schedules hours late under load (29-30.10: ~6.5h)
  workflow_dispatch:

permissions:
  contents: write

# shared by all feed workflows in this repo - they queue instead of racing on git push
concurrency:
  group: claude-feeds-push
  cancel-in-progress: false

env:
  OUT: dpi-feeds

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect issues, comments, discussions (last 8 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          SINCE=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          REPOS="net4people/bbs bol-van/zapret bol-van/zapret2 hufrea/byedpi Waujito/youtubeUnblock Flowseal/zapret-discord-youtube romanvht/ByeByeDPI GVCoder09/NoDPI dilluti0n/dpibreak xvzc/SpoofDPI XTLS/Xray-core"
          mkdir -p "$OUT"
          : > $OUT/items.jsonl
          : > $OUT/errors.txt
          for R in $REPOS; do
            gh api --paginate "repos/$R/issues?state=all&since=$SINCE&sort=updated&direction=desc&per_page=100" \
              --jq ".[] | select(.pull_request|not) | {type:\"issue\", repo:\"$R\", url:.html_url, title, user:.user.login, created:.created_at, updated:.updated_at, comments:.comments, body:((.body//\"\")[:1500])}" \
              >> $OUT/items.jsonl 2>>$OUT/errors.txt || echo "issues failed: $R" >> $OUT/errors.txt

            gh api --paginate "repos/$R/issues/comments?since=$SINCE&sort=updated&direction=desc&per_page=100" \
              --jq ".[] | {type:\"comment\", repo:\"$R\", url:.html_url, user:.user.login, created:.created_at, updated:.updated_at, body:((.body//\"\")[:1000])}" \
              >> $OUT/items.jsonl 2>>$OUT/errors.txt || echo "comments failed: $R" >> $OUT/errors.txt

            gh api graphql -f owner="${R%/*}" -f name="${R#*/}" -f query='
              query($owner:String!,$name:String!){repository(owner:$owner,name:$name){hasDiscussionsEnabled
                discussions(first:30,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{title url createdAt updatedAt author{login} body
                  comments(last:15){nodes{url createdAt author{login} body}}}}}}' \
              --jq ".data.repository | select(.hasDiscussionsEnabled) | .discussions.nodes[] | select(.updatedAt >= \"$SINCE\") | {type:\"discussion\", repo:\"$R\", url, title, user:.author.login, created:.createdAt, updated:.updatedAt, body:((.body//\"\")[:1500]), comments:[.comments.nodes[] | select(.createdAt >= \"$SINCE\") | {url, user:.author.login, created:.createdAt, body:((.body//\"\")[:800])}]}" \
              >> $OUT/items.jsonl 2>>$OUT/errors.txt || echo "discussions failed: $R" >> $OUT/errors.txt
          done
          # friendly projects hosted on GitLab (the digest's shell can't reach gitlab.com, Actions can)
          for P in netwalker071778/chimera-project; do
            python3 .github/scripts/gitlab_feed.py "$P" "$SINCE" >> $OUT/items.jsonl 2>>$OUT/errors.txt || echo "gitlab failed: $P" >> $OUT/errors.txt
          done
          # comment rows have no thread title - take it from the issue rows (a new comment bumps the issue's updated_at,
          # so its issue is in the snapshot). PR comments have no issue row and stay untitled.
          jq -s -c '(map(select(.type == "issue") | {key: .url, value: .title}) | from_entries) as $t
            | .[] | ((.url // "") | split("#")[0]) as $u
            | if .type == "comment" and $t[$u] then . + {title: $t[$u]} else . end' \
            $OUT/items.jsonl > $OUT/items.tmp && mv $OUT/items.tmp $OUT/items.jsonl \
            || { rm -f $OUT/items.tmp; echo "comment title join failed" >> $OUT/errors.txt; }
          # release notes for the digest (WebFetch is refused in its runs, git tags carry no notes)
          : > $OUT/releases.jsonl
          for R in DanielLavrushin/b4 DanielLavrushin/b4hub DanielLavrushin/asuswrt-merlin-xrayui bol-van/zapret bol-van/zapret2 hufrea/byedpi Waujito/youtubeUnblock dilluti0n/dpibreak GVCoder09/NoDPI xvzc/SpoofDPI ValdikSS/GoodbyeDPI Flowseal/zapret-discord-youtube romanvht/ByeByeDPI Runnin4ik/dpi-detector XTLS/Xray-core SagerNet/sing-box apernet/hysteria amnezia-vpn/amneziawg-go william-aqn/microtik-awg3-installer william-aqn/asuswrt-merlin-amneziawg; do
            gh api "repos/$R/releases?per_page=5" \
              --jq ".[] | {repo:\"$R\", tag:.tag_name, name, prerelease, published:.published_at, url:.html_url, body:((.body//\"\")[:1500])}" \
              >> $OUT/releases.jsonl 2>>$OUT/errors.txt || echo "releases failed: $R" >> $OUT/errors.txt
          done
          date -u +%Y-%m-%dT%H:%M:%SZ > $OUT/collected_at.txt
          wc -l $OUT/items.jsonl; cat $OUT/errors.txt

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git diff --cached --quiet || git commit -m "$OUT $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 15; done; exit 1   # the Pi pushes too
