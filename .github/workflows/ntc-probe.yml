# Temporary: can GitHub-hosted runners reach ntc.party? Deleted after one run.
name: ntc-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ntc.party
        run: |
          echo "runner ip: $(curl -sS -m 10 https://api.ipify.org)"
          for i in 1 2 3; do
            curl -4 -sS -m 15 -o /dev/null -w "https:443 try $i -> %{http_code}\n" https://ntc.party/robots.txt 2>&1 | tail -1
            curl -4 -sS -m 15 -o /dev/null -w "http:80 try $i -> %{http_code}\n" http://ntc.party/robots.txt 2>&1 | tail -1
          done
          curl -sS -m 15 -o /dev/null -w "control example.com -> %{http_code}\n" https://example.com/ 2>&1 | tail -1
          sudo apt-get install -y -qq traceroute >/dev/null 2>&1
          sudo traceroute -T -p 443 -n -w 2 -q 1 -m 20 130.255.77.28 || true
